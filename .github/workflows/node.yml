name: node

on:
  push:
    branches: [main]
    paths:
      - 'ws-chat/**'
      - 'lan-drop/**'
      - '.github/workflows/node.yml'
  pull_request:
    paths:
      - 'ws-chat/**'
      - 'lan-drop/**'
      - '.github/workflows/node.yml'

permissions:
  contents: read

concurrency:
  group: node-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [ws-chat, lan-drop]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            ws-chat/package-lock.json
            lan-drop/package-lock.json

      # ws-chat подключает lan-drop через file:, и tsc заходит в его исходники.
      # npm по такой ссылке зависимости связанного пакета не ставит.
      - name: install lan-drop
        if: matrix.project == 'ws-chat'
        run: npm ci
        working-directory: lan-drop

      - run: npm ci
        working-directory: ${{ matrix.project }}

      - run: npm run typecheck
        working-directory: ${{ matrix.project }}

      - run: npm test
        working-directory: ${{ matrix.project }}
