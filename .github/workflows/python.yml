name: python

on:
  push:
    branches: [main]
    paths:
      - 'certcheck/**'
      - 'dotenv-lint/**'
      - 'leakcheck/**'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - 'certcheck/**'
      - 'dotenv-lint/**'
      - 'leakcheck/**'
      - '.github/workflows/python.yml'

permissions:
  contents: read

concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [certcheck, dotenv-lint, leakcheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/pyproject.toml

      - run: pip install -e ".[dev]"
        working-directory: ${{ matrix.project }}

      - run: pytest
        working-directory: ${{ matrix.project }}
