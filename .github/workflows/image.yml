name: image

on:
  push:
    branches: [main]
    paths:
      - 'ws-chat/**'
      - 'lan-drop/**'
      - '.dockerignore'
      - '.github/workflows/image.yml'
    tags: ['v*']
  pull_request:
    paths:
      - 'ws-chat/Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # На пул-реквесте только собираем: публиковать чужие изменения нельзя.
      - name: log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ws-chat
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ws-chat/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Слои переживают прогоны: пересобирается только то, что изменилось.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Образ должен не просто собраться, а подняться и ответить.
      - name: проверить, что образ запускается
        if: github.event_name != 'pull_request'
        run: |
          docker run -d --name probe -p 3000:3000 \
            -e UPLOAD_KEY=$(openssl rand -hex 32) \
            ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/health | grep -q '"status":"ok"'
          docker logs probe
          docker rm -f probe
