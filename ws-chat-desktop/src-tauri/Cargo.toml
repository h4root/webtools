[package]
name = "ws-chat-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable — ради Window::add_child: своя полоса заголовка живёт отдельным
# вебвью, чтобы не вмешиваться в вёрстку страницы, пришедшей с сервера.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-http = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
