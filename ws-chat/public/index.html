<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ws-chat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="gate" class="gate">
    <form id="nick-form" class="nick-form">
      <h1>ws-chat</h1>
      <input id="nick-input" placeholder="никнейм" maxlength="24" autocomplete="off" autofocus>
      <button type="submit">войти</button>
      <p id="gate-error" class="gate-error"></p>
    </form>
  </div>

  <main id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="me" id="me"></div>
      <ul class="channels" id="channels"></ul>
      <div class="voice" id="voice">
        <div class="voice-controls">
          <button type="button" class="voice-toggle" id="voice-toggle"></button>
          <button type="button" class="voice-mute" id="voice-mute" hidden></button>
          <div class="settings" id="settings"></div>
        </div>
        <ul class="voice-users" id="voice-users"></ul>
      </div>
    </aside>
    <section class="chat">
      <header class="chat-header">
        <span id="chat-title"># public</span>
        <button type="button" class="call-btn" id="call-btn" hidden></button>
      </header>
      <div class="log" id="log"></div>
      <form class="composer" id="composer">
        <input id="text-input" placeholder="сообщение…" autocomplete="off" maxlength="2000">
        <button type="submit" id="send-btn"></button>
      </form>
    </section>

    <div class="call-incoming" id="call-incoming" hidden>
      <span class="call-incoming-text" id="call-incoming-text"></span>
      <div class="call-incoming-actions">
        <button type="button" class="call-accept" id="call-accept"></button>
        <button type="button" class="call-decline" id="call-decline"></button>
      </div>
    </div>

    <section class="call-panel" id="call-panel" hidden>
      <div class="call-grip" id="call-grip"></div>
      <div class="call-parties">
        <div class="party" id="party-me">
          <span class="ring"></span>
          <span class="pname">вы</span>
          <span class="meter"><i></i></span>
        </div>
        <div class="party" id="party-peer">
          <span class="ring"></span>
          <span class="pname" id="peer-name"></span>
          <span class="meter"><i></i></span>
        </div>
      </div>
      <div class="call-status" id="call-status"></div>
      <div class="call-stats" id="call-stats"></div>
      <div class="call-actions">
        <button type="button" class="call-mute" id="call-mute"></button>
        <button type="button" class="call-hangup" id="call-hangup"></button>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
