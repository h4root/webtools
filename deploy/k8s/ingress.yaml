# Пример под ingress-nginx. Здесь же завершается TLS — а значит браузер видит
# https, и микрофон со звонками работают без возни с сертификатом вручную.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ws-chat
  namespace: ws-chat
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Соединение чата живёт часами; таймауты по умолчанию рвут его молча.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Вложения до 25 МБ.
    nginx.ingress.kubernetes.io/proxy-body-size: "26m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - chat.example.com
      secretName: ws-chat-tls
  rules:
    - host: chat.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ws-chat
                port:
                  name: http
