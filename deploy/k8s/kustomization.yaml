apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ws-chat
# Секрет с ключом шифрования сюда намеренно не входит: он создаётся отдельной
# командой и не хранится в репозитории. См. раздел «Развёртывание».
resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
