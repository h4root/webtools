[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leakcheck"
version = "0.1.0"
description = "Сканер захардкоженных секретов с pre-commit хуком. Zero runtime dependencies."
requires-python = ">=3.11"
authors = [{ name = "h4root" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
leakcheck = "leakcheck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leakcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
